<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Document Summarizer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body class="bg-gray-900 text-white p-6">
  <div class="max-w-3xl mx-auto space-y-6">
    <h1 class="text-4xl font-bold text-center mb-4">AI Document Summarizer (PDF + TXT + Image)</h1>

    <div class="bg-gray-800 p-4 rounded-lg space-y-3">
      <label class="block font-semibold">Upload PDF / TXT / Image:</label>
      <input type="file" id="docFile" class="w-full text-gray-200 bg-gray-700 p-2 rounded" accept=".txt,.pdf,.png,.jpg,.jpeg" />

      <label class="block font-semibold mt-4">Or Paste Document Content:</label>
      <textarea id="docText" rows="10" placeholder="Paste your document here..." class="w-full p-3 bg-gray-700 rounded text-white"></textarea>

      <button onclick="summarize()" class="bg-blue-600 hover:bg-blue-700 px-5 py-2 rounded-lg font-bold mt-4">Summarize</button>
    </div>

    <div class="bg-gray-800 p-4 rounded-lg">
      <h2 class="text-xl font-semibold mb-2">Summary:</h2>
      <pre id="summaryOutput" class="whitespace-pre-wrap"></pre>
    </div>
  </div>

  <script>
    const API_KEY = "AIzaSyAgIPiDW0xo05XEX1De4VWVYJmWCOWartU";

    async function extractPDFText(file) {
      const reader = new FileReader();
      return new Promise((resolve, reject) => {
        reader.onload = async () => {
          const typedarray = new Uint8Array(reader.result);
          const pdf = await pdfjsLib.getDocument(typedarray).promise;
          let fullText = '';
          for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const content = await page.getTextContent();
            const strings = content.items.map(item => item.str).join(' ');
            fullText += strings + '\n';
          }
          resolve(fullText);
        };
        reader.onerror = reject;
        reader.readAsArrayBuffer(file);
      });
    }

    async function extractImageText(file) {
      return new Promise((resolve, reject) => {
        Tesseract.recognize(file, 'eng')
          .then(result => resolve(result.data.text))
          .catch(err => reject(err));
      });
    }

    async function summarize() {
      const textArea = document.getElementById('docText');
      const fileInput = document.getElementById('docFile');
      const output = document.getElementById('summaryOutput');

      let content = textArea.value;
      const file = fileInput.files[0];

      if (!content && file) {
        const fileType = file.type;

        if (fileType === "application/pdf") {
          content = await extractPDFText(file);
        } else if (fileType.startsWith("image/")) {
          output.textContent = "Extracting text from image using OCR...";
          content = await extractImageText(file);
        } else {
          content = await file.text();
        }
      }

      if (!content.trim()) {
        output.textContent = "Please enter or upload some content first.";
        return;
      }

      output.textContent = "Summarizing with Gemini 1.5 Flash... bhai ruk ja zara...";

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [{ text: `Summarize the following document:\n\n${content}` }]
            }]
          })
        });

        const data = await response.json();
        const summary = data.candidates?.[0]?.content?.parts?.[0]?.text;

        output.textContent = summary || "No summary mil paaya bhai. Try kar firse.";
      } catch (err) {
        output.textContent = "Gemini API error. Console me dekh bhai.";
        console.error(err);
      }
    }
  </script>
</body>
</html>
